[project]
name = "chatint"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rishav Sinha", email = "rishavsinha2302@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.6.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "openai>=3.46.0",
    "pywebview>=6.2.1",
]

[project.scripts]
chatint = "chatint.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
